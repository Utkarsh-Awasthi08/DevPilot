spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# So an unmapped route throws NoHandlerFoundException (caught by GlobalExceptionHandler and
# given the app's normal error JSON shape) instead of falling through to Spring Boot's default
# /error page. Safe to disable static-resource serving since this is a pure REST API.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Global dummy key to satisfy Spring AI unused model validations
spring.ai.openai.api-key=dummy

# Groq Chat Configuration
spring.ai.openai.chat.api-key=${GROQ_API_KEY:dummy-groq-api-key}
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# If the primary model errors out before streaming any output, ChatStreamHandler retries with
# each of these in order (same Free Plan RPM/TPM as the primary, but each is a separate quota
# bucket on Groq's side). Comma-separated, no spaces required. Leave blank to disable fallback.
app.groq.fallback-models=openai/gpt-oss-20b,qwen/qwen3.8-27b,qwen/qwen3.6-27b

# Proactive client-side pacing so the app stays under each account's shared rate limit instead
# of bursting and reacting to 429s afterward. Groq defaults match this account's Free Plan
# limits (console.groq.com/docs/rate-limits); Gemini defaults match its published free tier.
# Neither tracks the separate daily (RPD/TPD) caps.
app.rate-limit.embedding.rpm=60
app.rate-limit.embedding.tpm=20000000
app.rate-limit.groq.rpm=30
app.rate-limit.groq.tpm=8000
# Per-user (per-IP if unauthenticated) limit on our own /api/** endpoints.
app.rate-limit.api.rpm=120

# Mistral Embeddings Configuration
app.ai.mistral.api-key=${MISTRAL_API_KEY:dummy-mistral-api-key}
app.ai.mistral.base-url=https://api.mistral.ai/v1
app.ai.mistral.embedding.model=mistral-embed
spring.ai.openai.embedding.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
# Lax/non-secure works for local dev (localhost:3000 -> localhost:8080 is same-site to the
# browser), but breaks once frontend and backend are on different real domains — a cross-site
# fetch() only carries a cookie marked SameSite=None; Secure. Overridden in render.yaml.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=7d

app.frontend.url=${FRONTEND_URL:http://localhost:3001}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=1500
app.indexing.chunk-overlap=150
app.indexing.vector-batch-size=50
app.indexing.batch-delay-ms=1100
app.github.api-delay-ms=50

# Disable unused Spring AI OpenAI Auto-configurations
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.image.enabled=false

# Actuator & Observability
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Reverse Proxy configuration
server.forward-headers-strategy=framework
